<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121215">
  <title>Opções de download | Filmes Diretos</title>
  <link rel="stylesheet" href="/estilo.css">
  <script src="/menu.js" type="module"></script>
  <script src="/titulo.js" type="module"></script>
</head>
<body class="app-com-menu" data-menu="catalogo">
  <header class="site-header">
    <div class="shell site-header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Filmes <strong>Diretos</strong></span>
      </a>
    </div>
  </header>
  <nav id="menu-lateral" class="menu-lateral" aria-label="Ferramentas"></nav>
  <main class="shell pagina-titulo">
    <nav class="detalhe-nav" aria-label="Catálogo">
      <a class="detalhe-voltar" href="/catalogo.html"><span aria-hidden="true">←</span> Voltar ao catálogo</a>
    </nav>
    <div class="detalhe-layout">
      <div class="detalhe-capa" hidden>
        <img id="capa-titulo" alt="" referrerpolicy="no-referrer" decoding="async">
      </div>
      <section class="detalhe-conteudo" aria-labelledby="nome-titulo">
        <h1 id="nome-titulo">Detalhes do título</h1>
        <section class="detalhe-downloads" aria-labelledby="downloads-titulo">
          <h2 id="downloads-titulo">Downloads</h2>
          <p id="estado-titulo" role="status">Procurando opções de download…</p>
          <button id="tentar-downloads" class="botao secundario" type="button" hidden>Tentar novamente</button>
          <ul id="downloads"></ul>
        </section>
        <p id="origem-titulo" hidden><a>Abrir página original do título</a></p>
      </section>
    </div>
  </main>
</body>
</html>
