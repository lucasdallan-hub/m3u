<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121215">
  <title>Filmes Diretos</title>
  <link rel="stylesheet" href="/estilo.css">
  <script src="/menu.js" type="module"></script>
  <script src="/app.js" type="module"></script>
</head>
<body class="app-com-menu" data-menu="busca">
  <header class="site-header">
    <div class="shell site-header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Filmes <strong>Diretos</strong></span>
      </a>
    </div>
  </header>
  <nav id="menu-lateral" class="menu-lateral" aria-label="Ferramentas"></nav>
  <main class="shell pagina-inicial">
    <section class="hero" aria-labelledby="titulo-principal">
      <div class="hero-content">
        <h1 id="titulo-principal">Filmes e séries,<br><em>em um só lugar.</em></h1>
        <p>Encontre vídeos, arquivos .torrent e links magnet em catálogos autorizados.</p>
      </div>
    </section>

    <section class="painel-busca" aria-label="Localizar arquivos">
      <form id="busca">
        <label for="url">Endereço da página ou link direto</label>
        <div class="campo campo-simples">
          <div class="campo-url">
            <span class="icone-busca" aria-hidden="true"></span>
            <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://exemplo.com/filmes" required maxlength="4096">
          </div>
          <button class="botao primario" type="submit">Buscar links</button>
        </div>
        <label class="opcao">
          <input id="automatico" type="checkbox">
          <span>Baixar automaticamente quando houver um único resultado</span>
        </label>
      </form>
    </section>

    <section class="area-resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados">Resultados</h2>
      <p id="estado" role="status"></p>
      <ul id="resultados"></ul>
    </section>
  </main>
</body>
</html>
