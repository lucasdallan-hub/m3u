<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121215">
  <title>Varrer catálogo | Filmes Diretos</title>
  <link rel="stylesheet" href="/estilo.css">
  <script src="/menu.js" type="module"></script>
  <script src="/catalogo.js" type="module"></script>
</head>
<body class="app-com-menu" data-menu="catalogo">
  <header class="site-header">
    <div class="shell site-header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Filmes <strong>Diretos</strong></span>
      </a>
    </div>
  </header>
  <nav id="menu-lateral" class="menu-lateral" aria-label="Ferramentas"></nav>
  <main class="shell pagina-catalogo">
    <section class="entrada-catalogo" aria-labelledby="titulo-principal">
      <h1 id="titulo-principal">Varrer catálogo</h1>
      <p>Informe o endereço do catálogo para listar as capas e escolher um título.</p>
    </section>

    <section class="painel-busca" aria-label="Busca no catálogo">
      <form id="busca">
        <label for="url">Endereço do catálogo</label>
        <div class="campo campo-simples">
          <div class="campo-url">
            <span class="icone-busca" aria-hidden="true"></span>
            <input id="url" type="text" inputmode="url" autocomplete="off" placeholder="https://exemplo.com/filmes" required maxlength="4096">
          </div>
          <button class="botao primario" id="varrer" type="submit">Varrer catálogo</button>
        </div>
      </form>
      <div class="catalogo">
        <button class="botao discreto" id="usar-filmesmp4" type="button">Varrer FilmesMP4 <span class="icone-seta" aria-hidden="true"></span></button>
        <button class="botao secundario" id="parar" type="button" hidden>Parar varredura</button>
      </div>
    </section>

    <section class="area-resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados">Resultados</h2>
      <p id="estado" role="status"></p>
      <ul id="resultados"></ul>
    </section>
  </main>
</body>
</html>
